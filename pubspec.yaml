name: foldable_ext
description: "Renders an app on an Android foldable as on an iPhone Duo: window size, safe area and fold division. For building and debugging iPhone Duo layouts on a Galaxy Z Fold."
version: 0.2.0
repository: https://github.com/kuyazee/foldable_ext
issue_tracker: https://github.com/kuyazee/foldable_ext/issues

topics:
  - foldable
  - iphone-duo
  - android
  - responsive
  - layout

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  foldable: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kuyazee.foldable_ext
        pluginClass: FoldableExtPlugin
        dartPluginClass: FoldDivisionAndroid
