name: Publish

# pub.dev accepts automated publishing only from a tag push. Creating a GitHub
# release with a new tag pushes that tag, so a release starts this workflow.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      # pub.dev authenticates the upload with the GitHub OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Requests the OIDC token and registers it with pub. The Flutter SDK
      # installed next reads the same pub credentials.
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Check the tag matches pubspec.yaml
        run: |
          version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec.yaml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      # A version that is already on pub.dev cannot be uploaded again, so a
      # tag for one ends the job here instead of failing at the upload.
      - name: Skip a version that is already published
        run: |
          if curl -fsS https://pub.dev/api/packages/foldable_ext \
              | grep -q "\"version\":\"$version\""; then
            echo "foldable_ext $version is already on pub.dev"
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Get packages
        if: env.skip != 'true'
        run: flutter pub get

      - name: Analyze
        if: env.skip != 'true'
        run: flutter analyze --no-fatal-infos

      - name: Test
        if: env.skip != 'true'
        run: flutter test

      - name: Publish
        if: env.skip != 'true'
        run: flutter pub publish --force
